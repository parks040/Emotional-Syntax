<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>87 Emotions</title>
<style>
  :root { --fg:#fff; --bg:#000; --dim:rgba(255,255,255,.38); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--fg); }
  body { font-family:'Input Sans','InputSans','Input','Helvetica Neue',Helvetica,Arial,sans-serif; font-size:12px; letter-spacing:.01em; }
  button { font:inherit; color:inherit; background:none; border:1px solid var(--fg); padding:7px 12px; cursor:pointer; }
  button:hover { background:var(--fg); color:var(--bg); }
  button:disabled { opacity:.3; pointer-events:none; }

  .wrap { display:grid; grid-template-columns: minmax(0,1fr) minmax(360px, 44vw); min-height:100vh; }

  .vocab { padding:20px 20px 60px; display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:4px; align-content:start; }
  .cell { border:1px solid transparent; padding:12px 6px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--dim); user-select:none; }
  .cell svg { width:72px; height:50px; overflow:visible; }
  .cell svg * { fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .cell span { text-align:center; line-height:1.3; }
  .cell:hover { color:var(--fg); }
  .cell.on { color:var(--fg); border-color:var(--fg); }
  .cell .ord { font-size:10px; height:10px; line-height:10px; }

  .panel { border-left:1px solid var(--line); }
  .sticky { position:sticky; top:0; padding:24px 28px 28px; display:flex; flex-direction:column; gap:18px; max-height:100vh; }
  .eq { min-height:84px; }
  .eq .terms { color:var(--dim); line-height:1.6; }
  .eq .terms b { color:var(--fg); font-weight:400; }
  .eq .word { font-size:clamp(26px, 3.2vw, 44px); line-height:1.1; margin-top:6px; word-break:break-word; }
  .eq .empty { color:var(--dim); }
  .stage { width:100%; aspect-ratio:1 / 1; max-height:calc(100vh - 300px); align-self:center; }
  .stage svg { width:100%; height:100%; display:block; }
  .stage svg .g * { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .intensity { display:flex; align-items:center; gap:0; margin-right:auto; }
  .intensity button { width:32px; padding:7px 0; }
  .intensity output { min-width:96px; text-align:center; }
  .meta { color:var(--dim); display:flex; justify-content:space-between; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns:1fr; }
    .panel { border-left:0; border-bottom:1px solid var(--line); order:-1; }
    .sticky { position:static; max-height:none; }
    .stage { max-height:none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <main class="vocab" id="vocab"></main>

  <aside class="panel">
    <div class="sticky">
      <div class="eq" id="eq"></div>
      <div class="stage" id="stage"></div>
      <div class="controls">
        <div class="intensity">
          <button id="minus" aria-label="Less intense">−</button>
          <output id="int">Intensity 2</output>
          <button id="plus" aria-label="More intense">+</button>
        </div>
        <button id="shuffle">Shuffle</button>
        <button id="clear">Clear</button>
        <button id="copy">Copy SVG</button>
      </div>
      <div class="meta"><span id="seed"></span><span>Space to shuffle</span></div>
    </div>
  </aside>
</div>

// ---------- state ----------
let picked = [];          // indices in click order
let intensity = 2;
let seed = newSeed();

function newSeed(){ return Math.floor(Math.random()*1e6); }
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r, arr) => arr[Math.floor(r()*arr.length)];

// measure each glyph so it can be anchored exactly at a corner
(function(){
  const ns='http://www.w3.org/2000/svg', s=document.createElementNS(ns,'svg');
  s.setAttribute('style','position:absolute;left:-9999px;width:100px;height:100px');
  document.body.appendChild(s);
  DATA.forEach(d=>{ const g=document.createElementNS(ns,'g'); g.innerHTML=d.g; s.appendChild(g); const b=g.getBBox(); d.bx=b.x; d.by=b.y; d.bw=b.width; d.bh=b.height; });
  s.remove();
})();

// ---------- vocab grid ----------
const vocab = document.getElementById('vocab');
DATA.forEach((d,i)=>{
  const c = document.createElement('div');
  c.className='cell'; c.dataset.i=i; c.tabIndex=0;
  c.innerHTML = `<span class="ord"></span><svg viewBox="0 0 100 68">${d.g}</svg><span>${d.n}</span>`;
  c.onclick = ()=>toggle(i);
  c.onkeydown = e=>{ if(e.key==='Enter'){ toggle(i); } };
  vocab.appendChild(c);
});

function toggle(i){
  const k = picked.indexOf(i);
  if(k>=0) picked.splice(k,1); else picked.push(i);
  seed = newSeed();
  render();
}

// ---------- word blending ----------
function syl(name){
  const out=[];
  name.toLowerCase().split(/[\s-]+/).forEach(w=>{
    w=w.replace(/[^a-z]/g,''); if(!w) return;
    const m = w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/g);
    out.push(...((m && m.join('')===w) ? m : [w]));
  });
  return out;
}
function blend(names, r){
  if(names.length===1) return names[0];
  const S = names.map(syl);
  const used = new Set();                       // "word:index"
  const take = (i,j)=>{ used.add(i+':'+j); return S[i][j]; };
  const parts = [];
  // opening: 1 or 2 leading syllables of the first word (never its last one if it has more)
  const lead = (S[0].length>2 && r()<.5) ? 2 : 1;
  for(let j=0;j<lead;j++) parts.push(take(0,j));
  // one syllable from each other word, avoiding its ending when possible
  for(let i=1;i<S.length;i++){
    const n=S[i].length, max = n>1 ? n-1 : 1;
    parts.push(take(i, Math.floor(r()*max)));
  }
  // sometimes a stray middle syllable that has not been used
  if(r()<.4){
    const free=[]; S.forEach((s,i)=>s.forEach((_,j)=>{ if(j>0 && j<s.length-1 && !used.has(i+':'+j)) free.push([i,j]); }));
    if(free.length){ const [i,j]=pick(r,free); parts.push(take(i,j)); }
  }
  // ending: the last syllable of a word whose ending is still unused
  const ends = S.map((s,i)=>[i,s.length-1]).filter(([i,j])=>!used.has(i+':'+j));
  if(ends.length){ const [i,j]=pick(r,ends); parts.push(take(i,j)); }
  const w = parts.join('');
  return w.charAt(0).toUpperCase()+w.slice(1);
}

// ---------- pattern ----------
const W=600, H=600, INSET=3;
const CORNERS=[[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]]; // x,y, dirX, dirY (inward)

function compose(r){
  // spread emotions across corners first, then reuse
  const order=[0,1,2,3].sort(()=>r()-.5);
  let out='';
  picked.forEach((idx,n)=>{
    const [cx,cy,dx,dy] = CORNERS[n<4 ? order[n] : Math.floor(r()*4)];
    const s = 2.0 + r()*1.8;                 // base scale
    const flip = r()<.5;                     // swap axes, keeps it anchored to the corner
    const mode = r()<.5 ? 'step' : 'grow';   // how repetition unfolds
    const step = 14 + r()*30;
    const reps = intensity;
    for(let k=0;k<reps;k++){
      const off = mode==='step' ? k*step : 0;
      const sc0 = mode==='grow' ? s*(1+k*0.38) : s;
      const d0 = DATA[idx], room = W-2*INSET-off-4;
      if(room<=0) break;
      const sc = Math.min(sc0, room/Math.max(d0.bw,d0.bh,1));
      const px = cx+dx*(off+INSET), py = cy+dy*(off+INSET);
      const m = flip ? `matrix(0 ${dy*sc} ${dx*sc} 0 ${px} ${py})`
                     : `matrix(${dx*sc} 0 0 ${dy*sc} ${px} ${py})`;
      const d = DATA[idx];
      out += `<g transform="${m}"><g transform="translate(${-d.bx} ${-d.by})">${d.g}</g></g>`;
    }
  });
  return out;
}

function svgMarkup(inner, forExport){
  const style = forExport ? `<style>.g *{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}</style><rect x="-20" y="-20" width="${W+40}" height="${H+40}" fill="#000"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 ${W+12} ${H+12}">${style}
<defs><clipPath id="box"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>
<g class="g" clip-path="url(#box)">${inner}</g>
<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#fff" stroke-width="1.5"/></svg>`;
}

// ---------- render ----------
const eq=document.getElementById('eq'), stage=document.getElementById('stage');
let currentWord='';
function render(){
  document.querySelectorAll('.cell').forEach(c=>{
    const k = picked.indexOf(+c.dataset.i);
    c.classList.toggle('on', k>=0);
    c.querySelector('.ord').textContent = k>=0 ? String(k+1).padStart(2,'0') : '';
  });
  const r = rng(seed);
  const names = picked.map(i=>DATA[i].n);
  if(!names.length){
    eq.innerHTML = `<div class="terms empty">Nothing selected</div><div class="word empty">Pick a feeling</div>`;
    currentWord='';
  } else {
    currentWord = blend(names, r);
    eq.innerHTML = `<div class="terms">${names.map(n=>`<b>${n}</b>`).join(' + ')} =</div><div class="word">${currentWord}</div>`;
  }
  stage.innerHTML = svgMarkup(names.length ? compose(r) : '', false);
  document.getElementById('int').textContent = `Intensity ${intensity}`;
  document.getElementById('minus').disabled = intensity<=1;
  document.getElementById('plus').disabled = intensity>=8;
  document.getElementById('seed').textContent = `No. ${String(seed).padStart(6,'0')}`;
  ['shuffle','clear','copy'].forEach(id=>document.getElementById(id).disabled = !names.length);
}

document.getElementById('minus').onclick=()=>{ intensity=Math.max(1,intensity-1); render(); };
document.getElementById('plus').onclick =()=>{ intensity=Math.min(8,intensity+1); render(); };
document.getElementById('shuffle').onclick=()=>{ seed=newSeed(); render(); };
document.getElementById('clear').onclick=()=>{ picked=[]; render(); };
document.getElementById('copy').onclick=async(e)=>{
  const b=e.currentTarget;
  const names = picked.map(i=>DATA[i].n);
  const title = `<!-- ${names.join(' + ')} = ${currentWord} -->\n`;
  const r = rng(seed); if(names.length) blend(names, r);
  const svg = title + svgMarkup(compose(r), true);
  try { await navigator.clipboard.writeText(svg); b.textContent='Copied'; }
  catch(_) { b.textContent='Copy blocked'; }
  setTimeout(()=>b.textContent='Copy SVG',1400);
};
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && picked.length && e.target===document.body){ e.preventDefault(); seed=newSeed(); render(); }
});

// start with an example
picked = ['Happiness','Sadness','Loneliness'].map(n=>DATA.findIndex(d=>d.n===n));
render();
</script>
